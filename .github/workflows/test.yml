name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          cache: 'pip'

      - name: Install runtime + test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Verify code compiles
        run: |
          python -m compileall src/ app/

      - name: Run smoke tests (no training, no data download required)
        # These tests validate model definitions + legacy headline numbers +
        # comparison logic. They do NOT require the SDNET2018 dataset,
        # because they are skipped when data/ is missing.
        run: |
          pytest tests/test_models.py tests/test_infer.py -v

      - name: Optional: data-dependent tests (skip if SDNET2018 not present)
        run: |
          if [ -d "data/DATA_Maguire_20180517_ALL/SDNET2018" ]; then
            pytest tests/test_data.py -v
          else
            echo "SDNET2018 dataset not present — skipping data tests"
          fi
